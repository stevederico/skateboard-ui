# Publish to npm when a version tag (e.g. 5.2.1) is pushed.
# Uses npm Trusted Publishing (OIDC): no stored token and no 2FA prompt.
# One-time setup on npmjs.com: package Settings > Trusted Publisher >
# GitHub Actions, repository stevederico/skateboard-ui, workflow publish.yml.
name: Publish

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      # Libraries do not commit a lockfile, so install fresh.
      - run: npm install --no-audit --no-fund
      - name: Tag matches package.json
        run: test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish
